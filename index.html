<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#171b1b">
    <meta name="description"
        content="The personal desktop of Majed Altaemi. Explore games, experiments, and digital worlds by voidwave.">
    <link rel="icon" href="img/voidwave-512.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+Arabic:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="assets/fonts/iconfont.css">
    <link rel="stylesheet" href="desktop.css">
    <script src="scripts/desktop-language.js" defer></script>
    <script src="desktop.js" defer></script>
    <title>voidwave / Majed Altaemi</title>
</head>

<body>
    <div class="wallpaper" aria-hidden="true"></div>
    <header class="system-panel">
        <div class="panel-left">
            <button id="activities-button" class="panel-button" aria-label="Applications" aria-expanded="false"
                aria-controls="app-launcher"><i class="fa hn hn-grid"
                    aria-hidden="true"></i><span>Applications</span></button>
            <span class="panel-divider"></span>
            <span class="panel-brand">voidwave<span class="accent">.</span></span>
        </div>
        <time id="panel-clock" class="panel-clock"></time>
        <div class="panel-right">
            <select id="language-select" class="language-select" aria-label="Language / اللغة" title="Language / اللغة">
                <option value="en" lang="en">English</option>
                <option value="ar" lang="ar">العربية</option>
            </select>
            <a href="mailto:majed@voidwave.com" class="panel-button" aria-label="Email Majed" title="Email Majed"><i
                    class="fa hn hn-envelope" aria-hidden="true"></i></a>
            <button id="settings-button" class="panel-button" aria-label="Desktop settings" title="Desktop settings"><i
                    class="fa hn hn-cog" aria-hidden="true"></i></button>
        </div>
    </header>

    <main id="desktop" aria-label="Portfolio desktop">
        <div class="desktop-signature">
            <span class="eyebrow">MAJED ALTAEMI / INDEPENDENT GAME DEVELOPER</span>
            <h1>voidwave<span>.</span></h1>
            <p>Games. Experiments. Other worlds.</p>
        </div>
        <section class="mobile-clock" aria-label="Date and time">
            <p id="mobile-date"></p>
            <div id="mobile-time"></div>
            <span>MAJED ALTAEMI <span class="accent">/</span> GAME DEVELOPER</span>
        </section>
        <nav id="desktop-icons" class="desktop-icons" aria-label="Desktop applications"></nav>
        <div class="desktop-caption"><span class="status-dot"></span> MAKE ARABIA GREAT AGAIN <span>VOIDWAVE / PERSONAL
                DESKTOP</span></div>
        <div id="window-container"></div>
    </main>

    <section id="app-launcher" class="app-launcher" aria-label="Applications" hidden>
        <div class="launcher-search"><i class="fa hn hn-search" aria-hidden="true"></i><input id="app-search"
                type="search" placeholder="Search applications" aria-label="Search applications"
                autocomplete="off"><kbd>Esc</kbd></div>
        <div class="launcher-heading"><span>APPLICATIONS</span><span id="app-count"></span></div>
        <div id="launcher-apps" class="launcher-apps"></div>
        <p id="search-empty" hidden>No applications found.</p>
        <footer class="launcher-footer"><img src="img/voidwave-512.png" alt=""><span>majed<span
                    class="muted">@voidwave</span></span><a href="mailto:majed@voidwave.com" title="Email Majed"
                aria-label="Email Majed"><i class="fa hn hn-envelope" aria-hidden="true"></i></a></footer>
    </section>

    <nav id="dock" class="dock" aria-label="Favorite and running applications"></nav>
    <noscript>
        <div class="no-script">Majed Altaemi / voidwave. <a href="projects.html">Explore projects</a> or <a
                href="mailto:majed@voidwave.com">get in touch</a>. JavaScript enables the desktop experience.</div>
    </noscript>
</body>

</html>
