<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="utf-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no, maximum-scale=1">
    <meta name="theme-color" content="#141020">
    <meta name="description" content="رحلة المعرفة — لعبة أسئلة إسلامية بأسلوب البكسل آرت للجوال والحاسوب">
    <title>رحلة المعرفة — لعبة أسئلة إسلامية</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Handjet:wght@400;600;800&family=Noto+Kufi+Arabic:wght@400;600;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="./styles.css">
</head>

<body>
    <div id="game">
        <header id="hud">
            <div class="hud-group">
                <div id="hearts" class="hearts"></div>
                <div class="hud-stat keys"><img id="keyIcon" alt="مفاتيح"><span id="keysVal">0</span></div>
                <div class="hud-stat score"><img id="scoreIcon" alt="نقاط"><span id="scoreVal">0</span></div>
            </div>
            <div class="hud-group end">
                <div id="zoneName" class="zone"></div>
                <button id="mapBtn" class="icon-btn" title="الخريطة" aria-label="الخريطة">🗺</button>
                <button id="muteBtn" class="icon-btn" title="الصوت" aria-label="الصوت">🔊</button>
                <button id="fsBtn" class="icon-btn" title="ملء الشاشة" aria-label="ملء الشاشة">⛶</button>
            </div>
        </header>

        <main id="stage">
            <canvas id="screen" width="176" height="240"></canvas>

            <div id="mapPanel" class="panel hidden">
                <div class="panel-title">الخريطة</div>
                <canvas id="mapCanvas"></canvas>
                <div class="panel-hint">🟥 باب مغلق &nbsp; 🟩 مفتوح &nbsp; 🟠 سؤال لم يُجب</div>
            </div>

            <div id="toasts"></div>
            <div id="quiz" class="hidden"></div>
            <div id="screens" class="hidden"></div>

            <div id="controls">
                <div id="joyZone"></div>
                <div id="joyRing">
                    <div id="joyKnob"></div>
                </div>
                <button id="actionBtn" aria-label="تفاعل">تحدَّث</button>
            </div>
        </main>
    </div>

    <div id="rotateOverlay">
        <div class="rotate-inner">
            <div class="rotate-phone">🕌</div>
            <div>أدِر جهازك عموديًا للّعب</div>
        </div>
    </div>

    <script type="module" src="./js/main.js"></script>
</body>

</html>
