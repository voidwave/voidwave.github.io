<!DOCTYPE html>
<html dir="rtl" lang="ar">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0a0f10">
    <title>المصحف — صفحات القرآن الكريم</title>
    <script>
        // Apply the saved colour scheme before the first paint to avoid a flash.
        (function () {
            var theme = 'dark';
            try {
                theme = localStorage.getItem('quran-theme')
                    || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
            } catch (error) {
                theme = 'dark';
            }
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
    <style>
        /* ------------------------------------------------------------------
           Mushaf page test (index2.html)

           Every printed word is one glyph of the page font (p<page>.woff2),
           laid out on the 15 printed lines so the text breaks exactly like the
           Mushaf page. The real ʿUthmānī words sit behind the glyphs, so the
           text can still be selected, searched and copied.
        ------------------------------------------------------------------ */
        @font-face {
            font-family: 'Uthmanic';
            src: url('fonts/uthmanic_hafs_v22.ttf') format('truetype');
            font-display: swap;
        }

        :root {
            color-scheme: dark;
            --bg: #0a0f10;
            --surface: #111a1b;
            --surface-2: #16211f;
            --surface-3: #1e2b29;
            --border: rgba(255, 255, 255, 0.08);
            --text: #edf3f1;
            --text-dim: #b4c1bd;
            --muted: #8b9a96;
            --accent: #e2be6a;
            --accent-soft: rgba(226, 190, 106, 0.14);
            --on-accent: #1b1508;
            --appbar: rgba(10, 15, 16, 0.86);
            /* The printed sheet. Dark theme: dark paper, light ink — the glyphs
               are vector outlines, so only paper and ink change. */
            --paper-1: #171d1c;
            --paper-2: #101514;
            --paper-ink: #ece4d0;
            --paper-border: rgba(226, 190, 106, 0.28);
            --paper-glow: rgba(226, 190, 106, 0.06);
            --paper-rule: rgba(226, 190, 106, 0.35);
            --paper-number: #a4905e;
            --paper-banner-1: rgba(226, 190, 106, 0.13);
            --paper-banner-2: rgba(226, 190, 106, 0.03);
            --paper-hover: rgba(226, 190, 106, 0.14);
            --paper-active: rgba(226, 190, 106, 0.3);
            --paper-ring: rgba(226, 190, 106, 0.55);
            --paper-button: rgba(255, 255, 255, 0.06);
            --font-ui: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
            --font-ar: "Noto Naskh Arabic", "Segoe UI", Tahoma, serif;

            /* Size of one glyph, written by index2.js once the pages are set. */
            --fs: 34px;
            --lh: 60px;
            /* Height of the app bar, written by index2.js; the page reserves
               room for it at the bottom. */
            --appbar-h: 64px;
        }

        :root[data-theme="light"] {
            color-scheme: light;
            --bg: #f7f5ef;
            --appbar: rgba(250, 248, 243, 0.9);
            --surface: #ffffff;
            --surface-2: #f4f1e9;
            --surface-3: #eae5d9;
            --border: rgba(23, 43, 38, 0.12);
            --text: #17211f;
            --text-dim: #46544f;
            --muted: #6d7b76;
            --accent: #96701d;
            --accent-soft: rgba(150, 112, 28, 0.12);
            --on-accent: #fffaf0;
            /* The printed sheet: cream paper, dark ink. */
            --paper-1: #fbf7ec;
            --paper-2: #f1e9d5;
            --paper-ink: #1c1a14;
            --paper-border: rgba(201, 162, 79, 0.45);
            --paper-glow: rgba(201, 162, 79, 0.10);
            --paper-rule: rgba(160, 122, 40, 0.5);
            --paper-number: #7d6a35;
            --paper-banner-1: rgba(226, 190, 106, 0.2);
            --paper-banner-2: rgba(226, 190, 106, 0.05);
            --paper-hover: rgba(201, 162, 79, 0.25);
            --paper-active: rgba(201, 162, 79, 0.42);
            --paper-ring: rgba(160, 122, 40, 0.7);
            --paper-button: rgba(255, 255, 255, 0.55);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: radial-gradient(900px 600px at 75% -15%, #15231f, transparent), var(--bg);
            color: var(--text);
            font-family: var(--font-ui);
            -webkit-text-size-adjust: 100%;
        }

        [hidden] {
            display: none !important;
        }

        /* ------------------------------------------------------------------
           App bar (the same pieces as index.html)
        ------------------------------------------------------------------ */
        /* The bar sits at the BOTTOM of the screen and never hides. */
        .appbar {
            position: fixed;
            z-index: 30;
            bottom: 0;
            inset-inline: 0;
            padding-bottom: env(safe-area-inset-bottom);
            background: var(--appbar);
            border-top: 1px solid var(--border);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
        }

        .appbar__inner {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
            width: min(100% - 24px, 1180px);
            margin: 0 auto;
            padding: 10px 0;
        }

        .appbar__tools {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
            margin-inline-start: auto;
        }

        /* Only small screens need the menu button; wide ones show the tools. */
        #tools-toggle {
            display: none;
        }

        .btn {
            display: inline-flex;
            gap: 8px;
            align-items: center;
            justify-content: center;
            min-height: 42px;
            padding: 8px 13px;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: var(--surface);
            color: var(--text);
            font: inherit;
            font-size: 14px;
            text-decoration: none;
            cursor: pointer;
            transition: border-color 160ms ease, color 160ms ease, background-color 160ms ease;
        }

        .btn:hover {
            border-color: rgba(226, 190, 106, 0.5);
            color: var(--accent);
        }

        .btn svg {
            width: 18px;
            height: 18px;
            flex: 0 0 auto;
        }

        .btn--primary {
            background: var(--accent);
            border-color: transparent;
            color: var(--on-accent);
            font-weight: 600;
        }

        .btn--primary:hover {
            color: var(--on-accent);
            filter: brightness(1.06);
        }

        /* The page chip is a button now: it opens the page chooser. */
        #page-chip {
            min-height: 42px;
            cursor: pointer;
            transition: border-color 160ms ease, background-color 160ms ease;
        }

        #page-chip:hover {
            border-color: rgba(226, 190, 106, 0.7);
        }

        #page-chip[aria-expanded="true"] {
            border-color: var(--accent);
            background: rgba(226, 190, 106, 0.22);
        }

        #page-chip:focus-visible {
            outline: 2px solid var(--accent-soft);
            outline-offset: 2px;
        }

        /* The chooser drops out of the chip, centred on it. The double class
           beats the base .picker__panel rule, which sits later in the file. */
        .picker__panel.page-panel {
            inset-inline-start: auto;
            left: 50%;
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            gap: 8px;
            width: min(220px, calc(100vw - 32px));
            transform: translateX(-50%);
        }

        .chip {
            min-width: 62px;
            text-align: center;
            background: var(--accent-soft);
            border: 1px solid rgba(226, 190, 106, 0.35);
            color: var(--accent);
            border-radius: 999px;
            padding: 8px 12px;
            /* The Uthmanic font draws digits as decorated mushaf symbols, so
               numbers use the plain font. */
            font-family: var(--font-ar);
            font-size: 17px;
            line-height: 1.4;
        }

        /* ------------------------------------------------------------------
           Surah picker
        ------------------------------------------------------------------ */
        .picker {
            position: relative;
        }

        .picker__panel {
            position: absolute;
            z-index: 40;
            bottom: calc(100% + 8px);
            inset-inline-start: 0;
            width: min(330px, calc(100vw - 32px));
            max-height: min(64vh, 520px);
            overflow: auto;
            padding: 8px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            box-shadow: var(--shadow);
        }

        .picker__filter {
            width: 100%;
            height: 40px;
            margin-bottom: 6px;
            padding: 0 12px;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: var(--surface-2);
            color: var(--text);
            font-family: var(--font-ar);
            font-size: 15px;
        }

        .picker__filter:focus {
            outline: none;
            border-color: var(--accent);
        }

        .surah-item {
            display: flex;
            gap: 10px;
            align-items: center;
            width: 100%;
            padding: 8px 10px;
            border: 0;
            border-radius: 10px;
            background: transparent;
            color: var(--text);
            font: inherit;
            font-size: 14px;
            text-align: start;
            cursor: pointer;
        }

        .surah-item:hover {
            background: var(--accent-soft);
            color: var(--accent);
        }

        .surah-item__num {
            min-width: 30px;
            color: var(--muted);
            font-size: 12px;
            text-align: center;
        }

        .surah-item__name {
            flex: 1 1 auto;
            font-family: var(--font-ar);
            font-size: 15px;
        }

        .surah-item__page {
            color: var(--muted);
            font-size: 12px;
        }

        #theme-toggle .icon-sun {
            display: none;
        }

        :root[data-theme="light"] #theme-toggle .icon-sun {
            display: block;
        }

        :root[data-theme="light"] #theme-toggle .icon-moon {
            display: none;
        }

        /* ------------------------------------------------------------------
           Switch between the reader and the Mushaf view
        ------------------------------------------------------------------ */
        .view-switch {
            display: inline-flex;
            align-items: center;
            padding: 3px;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: var(--surface-2);
        }

        .view-switch__option {
            display: inline-flex;
            align-items: center;
            min-height: 34px;
            padding: 4px 15px;
            border-radius: 9px;
            color: var(--muted);
            font-family: var(--font-ar);
            font-size: 0.92rem;
            font-weight: 600;
            text-decoration: none;
            white-space: nowrap;
            transition: background-color 160ms ease, color 160ms ease;
        }

        .view-switch__option:hover {
            color: var(--text);
        }

        .view-switch__option.is-active {
            background: var(--accent);
            color: var(--on-accent);
        }

        /* ------------------------------------------------------------------
           Recitation: play the page with the chosen reciter
        ------------------------------------------------------------------ */
        .listen-group {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        #listen-toggle .icon-pause {
            display: none;
        }

        #listen-toggle.is-playing .icon-play {
            display: none;
        }

        #listen-toggle.is-playing .icon-pause {
            display: block;
        }

        .reciter-picker {
            position: relative;
            display: inline-flex;
            align-items: center;
        }

        .reciter-select {
            min-height: 42px;
            max-width: 11rem;
            padding: 8px 12px 8px 30px;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: var(--surface-2);
            color: var(--text);
            font-family: var(--font-ar);
            font-size: 0.95rem;
            font-weight: 600;
            line-height: 1.3;
            text-overflow: ellipsis;
            white-space: nowrap;
            appearance: none;
            -webkit-appearance: none;
            cursor: pointer;
        }

        .reciter-select:hover {
            border-color: var(--border-strong, rgba(226, 190, 106, 0.4));
            background: var(--surface-3);
        }

        .reciter-select:focus-visible {
            outline: 2px solid var(--accent-soft);
            outline-offset: 2px;
        }

        .reciter-select[disabled] {
            opacity: 0.45;
            cursor: progress;
        }

        .reciter-picker::after {
            position: absolute;
            inset-inline-end: 11px;
            top: 50%;
            width: 7px;
            height: 7px;
            border-right: 2px solid var(--muted);
            border-bottom: 2px solid var(--muted);
            transform: translateY(-65%) rotate(45deg);
            pointer-events: none;
            content: "";
        }

        /* The verse being recited, on whatever page is drawn. */
        .word.is-playing {
            background: var(--paper-active);
            box-shadow: 0 0 0 1px var(--paper-ring);
            border-radius: 0.16em;
        }

        /* ------------------------------------------------------------------
           The stacked pages
        ------------------------------------------------------------------ */
        #mushaf {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: clamp(14px, 2.4vw, 28px);
            padding: clamp(14px, 2.4vw, 28px) 12px 0;
        }

        /* One printed page; the slot keeps the page's height even while the page
           itself is not drawn, so the scrollbar (and the position) hold still. */
        .page-slot {
            display: flex;
            justify-content: center;
            /* never stretch the page: its own height is what gets measured */
            align-items: flex-start;
            width: 100%;
            scroll-margin-top: calc(var(--appbar-h) + 10px);
        }

        .foot {
            /* Room for the bottom bar so the credit reads above it. */
            padding: 26px 16px calc(var(--appbar-h) + 40px);
            color: var(--muted);
            font-size: 12px;
            line-height: 2;
            text-align: center;
        }

        /* ------------------------------------------------------------------
           The Mushaf page
        ------------------------------------------------------------------ */
        .page {
            width: min(100%, 820px);
            padding: clamp(14px, 2.4vw, 30px);
            /* the sheet follows the theme, so dark mode has dark pages */
            background: linear-gradient(180deg, var(--paper-1), var(--paper-2));
            color: var(--paper-ink);
            border: 1px solid var(--paper-border);
            border-radius: 14px;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45), inset 0 0 0 6px var(--paper-glow);
        }

        .page__lines {
            display: flex;
            flex-direction: column;
        }

        .line-row {
            display: flex;
            direction: rtl;
            justify-content: space-between;
            align-items: center;
            flex-wrap: nowrap;
            white-space: nowrap;
            /* The printed pages keep a fixed line pitch; without it the lines
               would collapse to the height of the glyphs. */
            height: var(--lh);
        }

        /* A line that does not reach the sheet's width (the short surahs on
           pages 1, 2 and 604) keeps the words' natural spacing, centred - the
           way quran.com shows those pages; a full line still stretches edge to
           edge. index2.js measures each line and sets the class. */
        .line-row.is-centered {
            justify-content: center;
        }

        /* The 0.04em padding exists to give the hover highlight some air; the
           centred pages drop it, so the words sit on their glyph advances the
           way quran.com lays them out. */
        .page--center .word {
            padding: 0;
        }

        .word {
            font-family: var(--page-font, 'Uthmanic'), 'Uthmanic', serif;
            font-size: var(--fs);
            line-height: 1;
            padding: 0 0.04em;
            border-radius: 0.16em;
            cursor: pointer;
            white-space: nowrap;
            transition: background-color 0.15s ease;
        }

        .word:hover {
            background: var(--paper-hover);
        }

        .word.is-open {
            background: var(--paper-active);
        }

        .word:focus-visible {
            outline: 2px solid var(--paper-ring);
            outline-offset: 1px;
        }

        .page__number {
            text-align: center;
            margin-top: 0.5em;
            /* plain numbers: the Uthmanic font would draw them as symbols */
            font-family: var(--font-ar);
            font-size: max(11px, calc(var(--fs) * 0.45));
            color: var(--paper-number);
        }

        /* The decorated surah banner that opens a surah in the print. In the
           Mushaf it takes two of the 15 printed lines (the line numbers around
           it skip from 9 to 12 on page 293). */
        .banner {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: calc(var(--fs) * 0.06);
            min-height: calc(var(--lh) * 2);
            padding: calc(var(--fs) * 0.08) calc(var(--fs) * 0.5);
            border: 1.5px solid var(--paper-rule);
            border-radius: calc(var(--fs) * 0.3);
            background: linear-gradient(180deg, var(--paper-banner-1), var(--paper-banner-2));
        }

        /* The cartouche itself comes from a ligature font: "018" -> the
           decorated name of surah 18. Kept hidden until the font is ready. */
        .chapter-icon::before {
            content: attr(data-chapter-icon);
            font-family: 'surahnames';
            font-size: calc(var(--fs) * 1.15);
            line-height: 1;
            visibility: hidden;
        }

        html[data-surah-names-ready="true"] .chapter-icon::before {
            visibility: visible;
        }

        .banner__head {
            display: flex;
            gap: calc(var(--fs) * 0.3);
            align-items: center;
            justify-content: center;
        }

        /* The play button beside the surah name: recites that surah. */
        .banner__play {
            display: inline-grid;
            place-items: center;
            /* never smaller than a comfortable tap, however small the page is */
            width: max(30px, calc(var(--fs) * 0.62));
            height: max(30px, calc(var(--fs) * 0.62));
            padding: 0;
            border: 1px solid var(--paper-rule);
            border-radius: 50%;
            background: var(--paper-button);
            color: var(--paper-number);
            cursor: pointer;
            transition: background-color 0.15s ease, color 0.15s ease, border-color 0.15s ease;
        }

        .banner__play svg {
            width: 55%;
            height: 55%;
        }

        .banner__play:hover {
            background: var(--paper-hover);
            border-color: var(--paper-ring);
            color: var(--paper-ink);
        }

        .banner__play:focus-visible {
            outline: 2px solid var(--paper-ring);
            outline-offset: 2px;
        }

        .banner__play.is-active {
            background: var(--paper-active);
            border-color: var(--paper-ring);
            color: var(--paper-ink);
        }

        .banner__play .icon-pause {
            display: none;
        }

        .banner__play.is-playing .icon-play {
            display: none;
        }

        .banner__play.is-playing .icon-pause {
            display: block;
        }

        .banner__basmala {
            font-family: 'Uthmanic', serif;
            font-size: calc(var(--fs) * 0.62);
            color: var(--paper-ink);
            opacity: 0.92;
        }

        /* The real verse text, kept in the DOM for search engines and screen
           readers (the glyph layer alone would be meaningless text). */
        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            overflow: hidden;
            clip-path: inset(50%);
            white-space: nowrap;
        }

        /* ------------------------------------------------------------------
           Word popover + toast
        ------------------------------------------------------------------ */
        .popover {
            position: fixed;
            z-index: 50;
            width: min(330px, calc(100vw - 24px));
            background: var(--surface-2);
            border: 1px solid var(--border);
            border-radius: 14px;
            box-shadow: 0 18px 42px rgba(0, 0, 0, 0.5);
            padding: 14px 16px 12px;
        }

        .popover__word {
            font-family: 'Uthmanic', serif;
            font-size: 30px;
            line-height: 1.6;
            text-align: center;
            color: #f7f3e7;
        }

        .popover__translit {
            text-align: center;
            color: var(--accent);
            font-size: 14px;
        }

        .popover__translation {
            text-align: center;
            color: var(--text-dim);
            font-size: 14px;
            margin-top: 6px;
            direction: ltr;
        }

        .popover__foot {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-top: 12px;
            padding-top: 10px;
            border-top: 1px solid var(--border);
        }

        .popover__loc {
            color: var(--muted);
            font-size: 12px;
        }

        .popover__actions {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .play-btn {
            background: var(--accent-soft);
            border: 1px solid rgba(226, 190, 106, 0.35);
            color: var(--accent);
            border-radius: 9px;
            padding: 6px 12px;
            font: inherit;
            font-size: 13px;
            cursor: pointer;
        }

        .play-btn:hover {
            border-color: rgba(226, 190, 106, 0.7);
        }

        .toast {
            position: fixed;
            inset-inline: 0;
            bottom: calc(var(--appbar-h) + 18px);
            margin-inline: auto;
            width: fit-content;
            max-width: min(720px, calc(100vw - 24px));
            background: var(--surface-3);
            border: 1px solid rgba(226, 190, 106, 0.35);
            color: var(--text);
            padding: 10px 18px;
            border-radius: 12px;
            box-shadow: 0 18px 42px rgba(0, 0, 0, 0.5);
            font-size: 14px;
            line-height: 1.9;
        }

        /* Small screens: the bar itself stays short, and the extra tools (the
         * reciter, the random surah and the theme) drop out of the menu button
         * instead of taking rows of their own. */
        @media (max-width: 700px) {
            .btn__label {
                display: none;
            }

            .btn--primary .btn__label {
                display: inline;
            }

            .appbar__inner {
                gap: 8px;
                /* Buttons hug the LEFT side of the bar: the thumb that scrolls
                   stays over the empty right side, away from the buttons. */
                justify-content: flex-end;
            }

            /* The surah list opens from the left screen edge so it is always
               fully on screen now that its button sits on the left. Making the
               wrapper static hands the panel the bar as its containing block. */
            #surah-picker {
                position: static;
            }

            #surah-panel {
                inset-inline-start: auto;
                left: 12px;
            }

            #tools-toggle {
                display: inline-flex;
            }

            .appbar__tools {
                position: absolute;
                bottom: 100%;
                inset-inline: 0;
                display: none;
                flex-direction: column;
                align-items: stretch;
                gap: 8px;
                margin-inline-start: 0;
                padding: 12px;
                background: var(--surface);
                border-top: 1px solid var(--border);
                box-shadow: var(--shadow);
            }

            .appbar.is-menu-open .appbar__tools {
                display: flex;
            }

            /* The menu has room for the labels the squeezed bar has to drop. */
            .appbar__tools .btn {
                width: 100%;
                justify-content: flex-start;
            }

            .appbar__tools .btn__label {
                display: inline;
            }

            /* The view switch moves into the menu so the bar keeps one row. */
            .appbar__tools .view-switch {
                width: 100%;
            }

            .appbar__tools .view-switch__option {
                flex: 1 1 0;
                justify-content: center;
            }

            .appbar__tools .reciter-picker,
            .appbar__tools .reciter-select {
                width: 100%;
                max-width: none;
            }

            .reciter-select {
                font-size: 0.9rem;
            }

            /* The controls are a little tighter so the whole bar stays one row. */
            .chip {
                min-width: 44px;
                padding: 8px 9px;
                font-size: 15px;
            }

            .listen-group {
                gap: 6px;
            }

            .view-switch__option {
                min-height: 40px;
                padding: 4px 8px;
                font-size: 0.85rem;
            }
        }

        /* Phones: tighten the bar a little more so it keeps to one row. */
        @media (max-width: 480px) {
            .appbar__inner {
                gap: 6px;
                padding: 8px 0;
            }

            .chip {
                min-width: 40px;
                padding: 8px 8px;
            }

            .btn {
                padding: 8px 11px;
            }
        }

        /* Very narrow phones (320-340 px): the surah button goes icon-only so
           the bar still fits on one row. */
        @media (max-width: 340px) {
            #surah-toggle .btn__label {
                display: none;
            }
        }
    </style>
</head>

<body>
    <header class="appbar" id="appbar">
        <div class="appbar__inner">
            <div class="picker" id="surah-picker">
                <button id="surah-toggle" class="btn btn--primary" type="button" aria-label="قائمة السور"
                    aria-expanded="false" aria-controls="surah-panel" title="قائمة السور">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
                        stroke-linejoin="round" aria-hidden="true">
                        <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path>
                        <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path>
                    </svg>
                    <span class="btn__label">السور</span>
                </button>
                <div id="surah-panel" class="picker__panel" hidden>
                    <input id="surah-filter" class="picker__filter" type="search" placeholder="ابحث عن سورة…"
                        autocomplete="off" spellcheck="false" aria-label="ابحث عن سورة">
                    <div id="surah-list"></div>
                </div>
            </div>

            <div class="picker page-picker" id="page-picker">
                <button id="page-chip" class="chip" type="button" aria-label="اختيار رقم الصفحة" aria-expanded="false"
                    aria-controls="page-panel" title="اختيار رقم الصفحة">١</button>
                <div id="page-panel" class="picker__panel page-panel" hidden>
                    <input id="page-input" class="picker__filter" type="text" inputmode="numeric" autocomplete="off"
                        spellcheck="false" placeholder="رقم الصفحة…" aria-label="رقم الصفحة من ١ إلى ٦٠٤">
                    <button id="page-go" class="btn btn--primary" type="button">اذهب</button>
                </div>
            </div>

            <div class="listen-group">
                <button id="listen-toggle" class="btn" type="button" aria-label="بدء التلاوة من هذه الصفحة"
                    aria-pressed="false" title="بدء التلاوة من هذه الصفحة" hidden>
                    <svg class="icon-play" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                        <path d="M7 4.5v15l13-7.5z"></path>
                    </svg>
                    <svg class="icon-pause" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                        <path d="M7 4h3.5v16H7zM13.5 4H17v16h-3.5z"></path>
                    </svg>
                    <span class="btn__label">التلاوة</span>
                </button>
            </div>

            <button id="tools-toggle" class="btn" type="button" aria-label="أدوات أخرى" aria-expanded="false"
                aria-controls="appbar-tools" title="أدوات أخرى">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                    aria-hidden="true">
                    <path d="M12 5h.01M12 12h.01M12 19h.01"></path>
                </svg>
            </button>

            <div class="appbar__tools" id="appbar-tools">
                <div class="view-switch" role="group" aria-label="التنقل بين القارئ والمصحف">
                    <a class="view-switch__option" id="reader-link" href="index.html"
                        title="فتح القارئ: النص العثماني مع التفاسير والترجمات والبحث">القارئ</a>
                    <span class="view-switch__option is-active" aria-current="page">المصحف</span>
                </div>
                <button id="random-button" class="btn" type="button" aria-label="سورة عشوائية" title="سورة عشوائية">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
                        stroke-linejoin="round" aria-hidden="true">
                        <path d="M16 3h5v5"></path>
                        <path d="M4 20 21 3"></path>
                        <path d="M21 16v5h-5"></path>
                        <path d="m15 15 6 6"></path>
                        <path d="m4 4 5 5"></path>
                    </svg>
                    <span class="btn__label">سورة عشوائية</span>
                </button>
                <button id="theme-toggle" class="btn" type="button" aria-label="Switch to light mode"
                    title="تفعيل الوضع النهاري">
                    <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path>
                    </svg>
                    <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <circle cx="12" cy="12" r="4"></circle>
                        <path
                            d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.5 1.5M17.6 17.6l1.5 1.5M4.9 19.1l1.5-1.5M17.6 6.4l1.5-1.5">
                        </path>
                    </svg>
                    <span class="btn__label">الوضع</span>
                </button>
                <label class="reciter-picker" id="reciter-picker" title="اختر القارئ" hidden>
                    <select id="reciter-select" class="reciter-select" aria-label="اختر القارئ" disabled>
                        <option value="">جارٍ التحميل…</option>
                    </select>
                </label>
            </div>
        </div>
    </header>

    <main id="mushaf"></main>

    <footer class="foot">
        خطوط صفحات المصحف لمجمع الملك فهد بن عبد العزيز
    </footer>

    <div class="popover" id="popover" hidden></div>
    <div class="toast" id="toast" role="status" hidden></div>

    <script src="index2.js"></script>
</body>

</html>
