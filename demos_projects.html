<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1c201f">
    <title>Experiments / voidwave</title>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="assets/fonts/iconfont.css">
    <link rel="stylesheet" href="desktop.css">
    <link rel="stylesheet" href="styles/experiments.css">
    <script src="scripts/embedded-page.js"></script>
</head>

<body>
    <header class="experiments-toolbar">
        <button id="backButton" class="experiment-control" title="Back to experiments" aria-label="Back to experiments"
            disabled><i class="hn hn-arrow-left" aria-hidden="true"></i></button>
        <div class="experiments-path"><i class="hn hn-code" aria-hidden="true"></i><span>experiments <span
                    id="current-project"></span></span></div>
        <a id="open-project" class="experiment-control" target="_blank" rel="noopener noreferrer"
            title="Open in browser" aria-label="Open in browser" hidden><i class="hn hn-external-link"
                aria-hidden="true"></i></a>
    </header>
    <main id="experiment-library">
        <div class="experiments-heading">
            <h1>Experiments</h1><span id="project-count"></span>
        </div>
        <div id="Files" class="experiment-grid" aria-label="Experimental apps"></div>
    </main>
    <section id="experiment-view" aria-label="Running experiment" hidden></section>
    <footer class="experiments-status"><span class="status-dot"></span><span id="experiment-status"
            role="status">voidwave / experiments</span></footer>

    <script src="scripts/demo_projects.js"></script>
</body>

</html>
